    <script>
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const vh = window.innerHeight; // 화면 1칸의 높이

            const nameLeft = document.querySelector('.about-scrolly-left');
            const nameRight = document.querySelector('.about-scrolly-right');
            const whiteBg = document.querySelector('.about-bg-wrapper');

            // 1. 스크롤을 살짝만(10px) 굴리면 이름이 양옆에서 날아옵니다!
            if (scrollY > 10) {
                nameLeft.classList.add('show');
                nameRight.classList.add('show');
            } else {
                // 맨 위로 올리면 다시 숨음
                nameLeft.classList.remove('show');
                nameRight.classList.remove('show');
            }

            // 2. 스크롤을 한참 내려서 화면의 60% 이상 내려가면 도화지가 아래서 올라옵니다!
            if (scrollY > vh * 0.6) {
                whiteBg.classList.add('show');
            } else {
                // 다시 스크롤을 위로 올리면 도화지가 밑으로 내려감
                whiteBg.classList.remove('show');
            }
        });
