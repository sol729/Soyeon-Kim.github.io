<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>김소연 | 포트폴리오</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="scrolly-container">
        <div class="sticky-wrapper">

            <div class="scroll-prompt">
                <p>Please scroll down</p>
                <span class="arrow">↓</span>
            </div>

            <div class="sentence-group scrolly-item welcome-area">
                <div class="word-group">
                    <img src="image/W.png" alt="W">
                    <img src="image/E.png" alt="E">
                    <img src="image/L.png" alt="L">
                    <img src="image/C.png" alt="C">
                    <img src="image/O.png" alt="O">
                    <img src="image/M.png" alt="M">
                    <img src="image/E.png" alt="E">
                    <img src="image/느낌표.png" alt="!">
                </div>
            </div>

            <div class="character-row">

                <div class="character-wrapper scrolly-item-horizontal flip-box">
                    <div class="flip-box-inner">
                        <div class="flip-box-front">
                            <img src="image/소연캐릭터.png" alt="소연 캐릭터" class="character-img">
                        </div>
                        <div class="flip-box-back">
                            <img src="image/소연1.png" alt="실제 소연" class="character-img">
                        </div>
                    </div>
                </div>

                <a href="menu.html" class="next-button-container scrolly-item-horizontal">
                    <img src="image/비행기.png" alt="비행기" class="airplane-img">

                    <div class="sentence-group button-area">
                        <div class="word-group">
                            <img src="image/G.png" alt="G"><img src="image/O.png" alt="O">
                        </div>
                        <div class="word-group">
                            <img src="image/T.png" alt="T"><img src="image/O.png" alt="O">
                        </div>
                        <div class="word-group">
                            <img src="image/S.png" alt="S"><img src="image/O.png" alt="O">
                            <img src="image/Y.png" alt="Y"><img src="image/E.png" alt="E">
                            <img src="image/O.png" alt="O"><img src="image/N.png" alt="N">
                        </div>
                    </div>
                </a>

            </div> </div> </div> <footer>
        <p>7syeonk29@gmail.com</p>
        <p>&copy; 2026. KIM SO YEON. All rights reserved.</p>
    </footer>

    <script>
        window.dispatchEvent(new Event('scroll'));
    </script>

</body>
</html>
